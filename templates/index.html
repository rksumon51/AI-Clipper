<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Clipper</title>
    <!-- Tailwind CSS (Modern Dark UI) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans antialiased flex flex-col items-center justify-center min-h-screen">

    <div class="max-w-2xl w-full bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600">
                AI Video Clipper
            </h1>
            <p class="text-gray-400 mt-2">1 লম্বা ভিডিও আপলোড করুন, পান 10টি ভাইরাল শর্টস</p>
        </div>

        <!-- Alert Message -->
        {% if message %}
        <div class="bg-green-500 bg-opacity-20 border border-green-500 text-green-400 p-4 rounded-lg mb-6 text-center">
            {{ message }}
        </div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            
            <!-- Option 1: YouTube Link -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Option 1: Paste YouTube Link</label>
                <input type="url" name="youtube_url" placeholder="https://youtube.com/watch?v=..." 
                    class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 text-white placeholder-gray-500 transition">
            </div>

            <div class="flex items-center justify-center space-x-4 my-4">
                <hr class="w-full border-gray-700">
                <span class="text-gray-500 font-bold">OR</span>
                <hr class="w-full border-gray-700">
            </div>

            <!-- Option 2: Upload File -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Option 2: Upload Video (Phone/PC)</label>
                <div class="flex items-center justify-center w-full">
                    <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed rounded-lg cursor-pointer hover:bg-gray-700 bg-gray-900 border-gray-600 hover:border-gray-500 transition">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <svg class="w-8 h-8 mb-4 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                            </svg>
                            <p class="mb-2 text-sm text-gray-400"><span class="font-semibold">Click to upload</span> or drag and drop</p>
                            <p class="text-xs text-gray-500">MP4, MKV (MAX. 2GB)</p>
                        </div>
                        <input type="file" name="video_file" class="hidden" accept="video/*" />
                    </label>
                </div> 
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold rounded-lg shadow-lg transform transition hover:scale-[1.02]">
                Generate AI Shorts
            </button>
        </form>
    </div>
</body>
</html>
